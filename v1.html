<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 안의 날씨 실험실 v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽은 책 한 쪽처럼 질문이 놓이는 지면, 오른쪽은 로직 상태를 보여주는 관측 기록지 */
:root{
  --paper:#EDF0F1; --page:#F8FAFA; --ink:#1E2833; --ink-2:#55626E; --line:#D3DADE;
  --sky:#2F6684; --sky-soft:#DCE8EF; --mine:#1E2833; --new-bg:#F7E3C9; --new-fg:#8A4A12; --flag-bg:#F4CFC6; --flag-fg:#9A2C17;
  --ok:#2E7A55; --warn:#A06A12;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161B; --page:#182027; --ink:#DCE3E8; --ink-2:#97A5B1; --line:#2B3640;
  --sky:#86B7D4; --sky-soft:#1F3443; --mine:#F1F5F8; --new-bg:#4A3418; --new-fg:#F2C894; --flag-bg:#5A241A; --flag-fg:#F7B6A5;
  --ok:#73C69A; --warn:#E3B260; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161B; --page:#182027; --ink:#DCE3E8; --ink-2:#97A5B1; --line:#2B3640;
  --sky:#86B7D4; --sky-soft:#1F3443; --mine:#F1F5F8; --new-bg:#4A3418; --new-fg:#F2C894; --flag-bg:#5A241A; --flag-fg:#F7B6A5;
  --ok:#73C69A; --warn:#E3B260; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1080px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em}
header.top p{margin:0;color:var(--ink-2);font-size:13px}
.modelbar{display:flex;gap:8px;flex-wrap:wrap}
.mb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--page);max-width:100%;cursor:pointer}
.mb span{color:var(--ink-2)} .mb code{font-family:var(--f-mono);font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.setbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 14px;border-radius:99px;border:1px solid var(--sky);background:var(--page);color:var(--sky)}
.setbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.setbtn.on,.setbtn:hover{background:var(--sky);color:var(--page)}
.settings{margin-bottom:22px;padding:16px 18px;border:1px solid var(--sky);border-radius:6px;background:var(--sky-soft)}
.settings-head{display:flex;justify-content:space-between;align-items:center}
.settings-head h2{font-size:17px;margin:0}
.settings input{background:var(--page)}
.mb .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)} .mb.off .dot{background:var(--warn)}
.page{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:28px clamp(18px,4vw,40px);min-height:520px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.bigq{font-family:var(--f-display);font-size:clamp(22px,3.4vw,28px);line-height:1.45;margin:10px 0 22px;text-wrap:balance}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;font-size:14px;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--page);color:var(--ink)}
button.primary{background:var(--sky);border-color:var(--sky);color:var(--page);font-weight:600}
button.quiet{border-color:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
button:disabled{opacity:.45;cursor:default}
.weathers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.weathers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wx{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:var(--paper)}
.wx svg{width:40px;height:40px;stroke:var(--sky);fill:none;stroke-width:1.6;stroke-linecap:round}
.wx:hover{border-color:var(--sky)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;min-height:28px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--sky-soft);color:var(--ink)}
.chip b{font-weight:600;color:var(--sky);margin-right:4px}
.scene{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 16px;border-left:3px solid var(--sky);background:var(--paper);margin-bottom:20px;font-size:14px}
.scene dt{color:var(--ink-2)} .scene dd{margin:0;font-weight:500}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.b{max-width:85%;padding:9px 14px;border-radius:14px;font-size:15px}
.b.ai{background:var(--sky-soft);align-self:flex-start;border-bottom-left-radius:4px}
.b.me{background:var(--paper);border:1px solid var(--line);align-self:flex-end;border-bottom-right-radius:4px}
.b.btn{font-style:italic;color:var(--ink-2)}
.note{color:var(--ink-2);font-size:13px}
.busy{color:var(--sky);font-size:14px;margin-top:10px}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.card{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:14px}
.card small{color:var(--sky);font-weight:600;font-size:11px}
.card.off{opacity:.4;text-decoration:line-through}
.card button{padding:2px 8px;border:none;background:none;color:var(--ink-2)}
h2{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
h3{font-size:13px;letter-spacing:.06em;color:var(--ink-2);margin:22px 0 8px;font-weight:600}
.draft{font-family:var(--f-display);font-size:18px;line-height:1.95;max-width:34em}
.draft h2{font-size:24px;margin-bottom:14px}
.draft p{margin:0 0 1em}
.w-mine{font-weight:700;color:var(--mine)}
.w-new{background:var(--new-bg);color:var(--new-fg);border-radius:2px;padding:0 1px}
.w-flag{background:var(--flag-bg);color:var(--flag-fg);border-radius:2px;padding:0 2px;text-decoration:underline wavy}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.stat{border-top:2px solid var(--line);padding-top:6px}
.stat span{display:block;font-size:12px;color:var(--ink-2)}
.stat strong{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat.bad{border-color:var(--flag-fg)} .stat.good{border-color:var(--ok)}
ol.qa{padding-left:20px;margin:0;font-size:14px} ol.qa li{margin-bottom:6px} ol.qa .q{color:var(--ink-2);display:block;font-size:12.5px}
/* 관측 기록지 */
aside.log{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:16px;font-size:13px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));min-width:0}
@media (max-width:860px){aside.log{position:static}}
aside.log h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.slots{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px;margin-bottom:12px}
.slots td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}
.st{font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.st-FILLED{background:var(--sky-soft);color:var(--sky)} .st-EMPTY{color:var(--ink-2);border:1px dashed var(--line)} .st-UNKNOWN{background:var(--new-bg);color:var(--new-fg)}
.rule{font-family:var(--f-mono);font-size:12px;background:var(--paper);padding:8px;border-radius:4px;margin-bottom:12px;white-space:pre-wrap}
.events{max-height:300px;overflow:auto;font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:6px}
.events div{border-left:2px solid var(--line);padding-left:8px;white-space:pre-wrap;word-break:break-all}
.events .drop{border-color:var(--flag-fg)} .events .fail{border-color:var(--warn)}
.banner{padding:10px 14px;border-radius:4px;background:var(--new-bg);color:var(--new-fg);font-size:14px;margin-bottom:16px}
details.hist{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
details.hist summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.histitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
@media (prefers-reduced-motion:no-preference){.page>*{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

</head>
<body>
<header class="top">
  <h1>내 안의 날씨 실험실 <span class="note">v1 · 2·3단계 로직 문서 + 초안 지침(10/30) · <a href="/">v2로</a></span></h1>
  <div class="modelbar" id="modelbar" aria-live="polite"></div>
</header>
<div class="wrap">
  <main class="page" id="main"></main>
  <aside class="log" id="log"></aside>
</div>

<script src="draft-guide.js"></script>
<script>
/* ---------- 기본값 ---------- */
const WEATHERS=['맑음','흐림','비','눈','바람','안개','갠 뒤 추움','해 나는데 비'];
const ICON={
 '맑음':'<circle cx="20" cy="20" r="7"/><path d="M20 5v4M20 31v4M5 20h4M31 20h4M9 9l3 3M28 28l3 3M9 31l3-3M28 12l3-3"/>',
 '흐림':'<path d="M11 28h18a6 6 0 0 0 0-12 9 9 0 0 0-17 2 5 5 0 0 0-1 10z"/>',
 '비':'<path d="M11 22h18a6 6 0 0 0 0-12 9 9 0 0 0-17 2 5 5 0 0 0-1 10z"/><path d="M14 27l-2 5M20 27l-2 5M26 27l-2 5"/>',
 '눈':'<path d="M11 22h18a6 6 0 0 0 0-12 9 9 0 0 0-17 2 5 5 0 0 0-1 10z"/><circle cx="14" cy="29" r="1"/><circle cx="20" cy="32" r="1"/><circle cx="26" cy="29" r="1"/>',
 '바람':'<path d="M6 15h20a4 4 0 1 0-4-4M6 21h26a4 4 0 1 1-4 4M6 27h12"/>',
 '안개':'<path d="M7 14h26M10 20h22M7 26h26M12 32h16"/>',
 '갠 뒤 추움':'<circle cx="15" cy="15" r="5"/><path d="M15 5v2M5 15h2M8 8l1.5 1.5"/><path d="M26 22v12M21 25l10 6M21 31l10-6"/>',
 '해 나는데 비':'<circle cx="27" cy="12" r="5"/><path d="M27 3v2M36 12h-2M33 6l-1.5 1.5"/><path d="M8 26h14a5 5 0 0 0 0-10 7 7 0 0 0-13 2 4 4 0 0 0-1 8z"/><path d="M11 30l-1.5 4M17 30l-1.5 4"/>'
};
const Q2={TIME:[w=>`${w} 같았던 날, 하루만 떠올려 볼까요? 언제였어요?`,()=>'그 일이 있던 때는 언제쯤이었어요?'],
          PLACE:[()=>'그날 있던 곳 한 군데만 떠올려 볼까요? 어디였어요?',()=>'그때 있던 곳은 어디였어요?']};
const Q3={event:['그때 거기서 무슨 일이 있었어요?','그 자리에서 있었던 일 하나만 떠올려 볼까요?'],
          object:['그 자리에 뭐가 있었어요?','가까이에 눈에 띄던 물건 하나만 떠올려 볼까요?'],
          sense:['그때 들리거나 느껴지던 게 있었어요?','소리, 냄새, 온도처럼 느낀 것 하나만 떠올려 볼까요?'],
          speech:['그 자리에서 누군가 한 말이 있었어요?','들었던 말 한마디만 떠올려 볼까요?'],
          after:['그 일이 있고 나서 달라진 게 있었어요?','그 뒤로 하게 된 일이나 안 하게 된 일이 있어요?']};
const S3NAME={event:'사건',object:'사물',sense:'감각',speech:'타인의 말',after:'그 후'};
// 질문 모드: 기본 = 명세(사건·사물·감각), 확장 = 기획안의 '타인의 말'과 '그 후 달라진 점'을 더 묻는다
const ORDER_BASE=['event','object','sense'], ORDER_EXT=['event','object','sense','speech','after'];
let ORDER=ORDER_BASE;
const MODE_NAME={base:'기본',ext:'확장'};

let fatal='', showSettings=false;
let S;
/* 설정: 이 브라우저에만 저장 */
const CFG={pass:'',extract:'',draft:'',models:[],mode:'base'};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('naenal-cfg')||'{}'))}catch(e){}
function saveCfg(){try{localStorage.setItem('naenal-cfg',JSON.stringify({pass:CFG.pass,extract:CFG.extract,draft:CFG.draft,bad:CFG.bad||[],mode:CFG.mode,effort:CFG.effort,temp:CFG.temp}))}catch(e){}}
const USAGE=[]; // {role,model,in,out,ms}
function fresh(){
  S={phase:'weather',weather:'',wxCustom:false,
     s2:{TIME:{st:'EMPTY',asked:0,val:''},PLACE:{st:'EMPTY',asked:0,val:''},answers:[]},
     sceneNo:1, discarded:[], scene:null,
     s3:{event:{st:'EMPTY',asked:0,vals:[]},object:{st:'EMPTY',asked:0,vals:[]},sense:{st:'EMPTY',asked:0,vals:[]},speech:{st:'EMPTY',asked:0,vals:[]},after:{st:'EMPTY',asked:0,vals:[]},answers:[],started:false},
     cur:null, rule:'날씨를 고르기 전', events:[], busy:false, paused:null,
     removed:new Set(), extra:'', draft:null, drafts:[], t0:null, tDraftClick:null, waitMs:0, pauses:0};
}
fresh();

// 대화형이 아닌 모델(임베딩, 재순위, 안전 필터, 이미지·음성 등)은 목록에서 뺀다
const NOT_CHAT=/image|imagen|veo|live|native-audio|audio|tts|computer-use|robotics|aqa|embed|rerank|reward|guard|safety|shield|vision|-vl|vlm|clip|parse|ocr|whisper|tts|asr|riva|retriev|cosmos|detect|segment|sdxl|flux|stable-diffusion|diffusion|kosmos|paligemma|deplot|fuyu|neva|vila|nvclip|grounding|pii|content-safety|topic-control|jailbreak|calibration|starcoder|codestral|codegemma|coder|code-|math|bge|e5-|arctic-embed|nemoretriever|usdcode|reason-rm|-rm\b/i;
// 판독은 빠르고 지시를 잘 따르는 모델, 초안은 한국어가 좋은 큰 모델 우선
const EXTRACT_PREF=[/^gemini:gemini-3\.5-flash-lite/i,/^gemini:.*flash-lite/i,/qwen3/i,/llama-3\.3-70b-instruct/i,/qwen2\.5-72b/i,/llama-4.*instruct/i,/qwen/i,/mistral-(small|medium|large).*instruct/i,/gemma-3/i,/llama.*70b.*instruct/i];
const DRAFT_PREF=[/^gemini:gemini-3\.5-flash$/i,/^gemini:gemini-3\.\d-flash$/i,/^gemini:.*flash(?!-lite)/i,/deepseek-v4-flash/i,/qwen3.*(235b|397b|480b|122b|max)/i,/deepseek-v[34]/i,/qwen3/i,/llama-4-maverick/i,/llama-3\.3-70b-instruct/i,/qwen/i,/mistral-large/i];
function pickModel(prefs){for(const re of prefs){const m=CFG.models.find(x=>re.test(x)&&!/thinking|reason|r1|deepseek-v4|preview/i.test(x));if(m)return m}for(const re of prefs){const m=CFG.models.find(x=>re.test(x));if(m)return m}return CFG.models.find(m=>/instruct|chat/i.test(m))||CFG.models[0]||''}
async function loadModels(){
  try{
    const r=await fetch('/api/models',{headers:{'x-passcode':encodeURIComponent(CFG.pass)}});
    const j=await r.json();
    if(!r.ok){fatal=j.message||'모델 목록을 불러오지 못했어요.';return render()}
    fatal='';
    const all=j.models||[];
    CFG.models=all.filter(m=>!NOT_CHAT.test(m)&&!(CFG.bad||[]).includes(m));
    const ok=m=>m&&CFG.models.includes(m);
    if(!ok(CFG.extract))CFG.extract=(ok(j.defaults?.extract)&&j.defaults.extract)||pickModel(EXTRACT_PREF);
    if(!ok(CFG.draft))CFG.draft=(ok(j.defaults?.draft)&&j.defaults.draft)||pickModel(DRAFT_PREF)||CFG.extract;
    ev(`모델 ${all.length}개 중 대화형 ${CFG.models.length}개. 판독: ${CFG.extract} / 초안: ${CFG.draft}`);
    saveCfg();
  }catch(e){fatal='서버에 연결하지 못했어요. Vercel 배포 주소에서 열었는지 확인해 주세요.'}
  render();
}

/* ---------- LLM 호출 (우리 서버 → NVIDIA) ---------- */
// 초안: 서버가 쓰는 대로 흘려보내는 글을 받아 화면에 바로 보여 준다
async function streamLLM(prompt,model,onText){
  const t=performance.now();
  try{
    const ctl=new AbortController();let first=false;
    const timer=setTimeout(()=>{if(!first)ctl.abort()},90000);
    let r;
    try{r=await fetch('/api/chat',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','x-passcode':encodeURIComponent(CFG.pass)},
      body:JSON.stringify({model,prompt,role:'draft',max_tokens:3000,temperature:CFG.temp??0.4,effort:CFG.effort||'minimal'})});}
    catch(e){clearTimeout(timer);throw {code:'no_response',message:`${model}이(가) 90초 동안 응답하지 않았어요. 무료 등급에서 붐비는 모델일 수 있으니 초안 모델을 바꿔 보세요.`}}
    if(!r.ok){const j=await r.json().catch(()=>({}));const m=j.message||'';throw {code:/not found/i.test(m)?'model_unavailable':(j.error||('http_'+r.status)),message:m}}
    const rd=r.body.getReader(),dec=new TextDecoder();let all='';
    for(;;){let x;try{x=await rd.read()}catch(e){clearTimeout(timer);throw {code:'no_response',message:`${model}이(가) 90초 동안 글을 보내지 않았어요. 초안 모델을 바꿔 보세요.`}}const {value,done}=x;if(done)break;if(value&&value.length)first=true;all+=dec.decode(value,{stream:true});const k=all.indexOf('\u0000');onText(k<0?all:all.slice(0,k))}
    clearTimeout(timer);all+=dec.decode();
    const k=all.indexOf('\u0000');const text=k<0?all:all.slice(0,k);let meta={};
    try{meta=JSON.parse(all.slice(k+1))}catch(e){}
    USAGE.push({role:'draft',model,in:meta.usage?.prompt_tokens||0,out:meta.usage?.completion_tokens||0,ms:meta.ms||0});
    if(meta.error&&!text.trim())throw {code:meta.error==='timeout'?'timeout':'empty',message:meta.error};
    if(meta.error)ev(`초안이 중간에 끊겼어요 (${meta.error}). 받은 데까지 씁니다.`,'fail');
    return text;
  }finally{S.waitMs+=performance.now()-t}
}
async function callLLM(prompt,role,model,max_tokens){
  const t=performance.now();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','x-passcode':encodeURIComponent(CFG.pass)},
      body:JSON.stringify({model,prompt,role,max_tokens,temperature:role==='draft'?0.4:0})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const m=j.message||'';throw {code:/not found for account|not found|404/i.test(m)?'model_unavailable':(j.error||('http_'+r.status)),message:m}}
    USAGE.push({role,model,in:j.usage?.prompt_tokens||0,out:j.usage?.completion_tokens||0,ms:j.ms||0});
    return j.text||'';
  }finally{S.waitMs+=performance.now()-t}
}
function parseJSON(text){
  let t=String(text).replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(f)t=f[1];
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0||b<a)throw {code:'invalid_json',message:t.slice(0,200)};
  try{return JSON.parse(t.slice(a,b+1))}catch(e){throw {code:'invalid_json',message:t.slice(0,200)}}
}
async function callJSON(prompt,role){
  const model=role==='draft'?CFG.draft:CFG.extract;
  return parseJSON(await callLLM(prompt,role,model,role==='draft'?3000:1200));
}
function swapModel(role){
  const key=role==='draft'?'draft':'extract', bad=CFG[key];
  CFG.bad=[...new Set([...(CFG.bad||[]),bad])];
  CFG.models=CFG.models.filter(m=>m!==bad);
  CFG[key]=pickModel(role==='draft'?DRAFT_PREF:EXTRACT_PREF);
  saveCfg();
  ev(`"${bad}"는 이 계정에서 쓸 수 없는 모델이에요 → "${CFG[key]||'없음'}"(으)로 바꿔서 다시 불러요`,'fail');
  renderModelbar();
  return !!CFG[key];
}
async function withRetry(label,fn){
  let swaps=0;
  for(let i=0;i<2;i++){
    try{return await fn()}catch(e){
      if(['bad_passcode','no_key'].includes(e.code)){fatal=e.message;render();throw e}
      if(e.code==='model_unavailable'&&swaps<4&&swapModel('extract')){swaps++;i--;continue}
      ev(`${label} 실패 (${e.code})${e.message?'\n모델 응답: '+String(e.message).slice(0,200):''}${i===0?'\n→ 자동 재시도':'\n→ 답을 읽지 못함 (횟수는 세지 않음)'}`,'fail');
    }
  }
  return null;
}
function keep(v,src,label){
  if(typeof v!=='string')return null;
  const s=v.trim(); if(!s)return null;
  if(src.includes(s))return s;
  const sq=x=>x.replace(/\s+/g,'');
  if(sq(src).includes(sq(s)))return s;
  ev(`${label} "${s}" 버림: 원문에 그대로 없음`,'drop'); return null;
}
async function extract2(ans){
  const p=`너는 글쓰기 앱의 답 판독기다. 사용자의 답 한 개에서 '때'와 '장소'를 가리키는 말만 원문 그대로 뽑는다. 답의 종류(모름, 되묻기, 끝내기)는 판단하지 않는다.
- time: 장면이 일어난 하루, 한 순간, 또는 시기를 가리키는 말. 넓어도 인정한다. 예: "2019년 3월 2일", "2학년 가을 축제 날", "작년 겨울", "대학 시절", "어릴 때는 늘", "엄마랑 시장 갔던 날"
- place: 장면이 일어난 장소. 넓어도 인정한다. 예: "할머니 댁 부엌", "학교 앞", "공대 비상계단", "서울", "시장"
- 감정, 평가, 깨달음만 있으면 둘 다 null. 예: "너무 슬펐어요", "그때 사람은 혼자라는 걸 알았어요", "그냥 혼자 있었어요", "엄마가 울고 계셨어요"
- "모르겠어요", "예를 들면요?", "그만할래요", 의미 없는 자모도 값이 없는 답이다.
- 값은 반드시 답 안에 글자 그대로 있는 연속된 조각이어야 한다. 고치거나 요약하거나 보태지 않는다. 끝에 붙은 "이요", "에서" 같은 조사·어미는 떼도 된다.

예시
답: "작년 겨울 학교 앞에서 넘어졌어요" → {"time":"작년 겨울","place":"학교 앞"}
답: "대학 시절이요" → {"time":"대학 시절","place":null}
답: "너무 슬펐어요" → {"time":null,"place":null}

답: """${ans}"""

설명 없이 JSON 하나만 출력: {"time": 문자열 또는 null, "place": 문자열 또는 null}`;
  const r=await withRetry('때·장소 판독',()=>callJSON(p,'extract'));
  if(r===null)return {failed:true};
  const out={time:keep(r?.time,ans,'time'),place:keep(r?.place,ans,'place')};
  ev(`판독 ← "${ans}"\n→ ${JSON.stringify(r)}\n채택 ${JSON.stringify(out)}`);
  return out;
}
async function extract3(ans,label){
  const p=`너는 글쓰기 앱의 답 판독기다. 사용자의 답에서 아래 세 슬롯을 가리키는 말만 원문 그대로 뽑는다. 답의 종류(모름, 되묻기, 끝내기)는 판단하지 않는다.
- event(사건): 그 자리에서 일어난 일. 내가 한 일, 남이 한 일, 벌어진 일 모두. 예: "버스를 놓쳤어요", "엄마가 괜찮다고 했어요", "우산 쓰고 엄마를 기다렸어요". 감정만 있는 말("너무 슬펐어요")은 사건이 아니다.
- object(사물): 그 자리에 있던 물건. 사람은 제외. 예: "우산", "삼각김밥", "자판기"
- sense(감각): 소리, 냄새, 온도, 촉감, 빛, 맛. "아무 소리도 안 났어요"처럼 없다는 말도 감각을 가리키면 포함. "없었어요"처럼 감각을 가리키는 말이 없으면 제외.
- 마음의 날씨: 사용자가 고른 날씨는 "${S.weather}"이고, 그날 마음의 비유다. 이 날씨를 비유로 말한 표현(예: "비가 내리기 시작했어요", "계속 비가 내렸어요", "마음이 맑았어요")은 어느 슬롯에도 넣지 않는다. 그 자리에서 몸으로 실제로 겪은 날씨(예: "비가 차가웠어요", "우산을 썼어요")만 감각이나 사건으로 넣는다.${S.mode==='ext'?`
- speech(타인의 말): 그 자리에서 다른 사람이 한 말. 따옴표가 없어도 "~라고 했어요"처럼 전한 말이면 포함. 예: "다들 괜찮다고 일어서라고 했어요", "엄마가 괜찮다고 했어요". 같은 조각이 사건이면서 타인의 말이어도 된다.
- after(그 후): 그 일 뒤에 달라진 행동이나 상황. 예: "그 뒤로 계주는 안 나갔어요", "다음 해에는 맨 앞에서 뛰었어요". 감정, 깨달음, 교훈("덕분에 성장했어요")은 제외.`:''}
- 감정은 슬롯이 아니다. "모르겠어요", "뭐라고요?", "그만할래요"는 값이 없는 답이다.
- 각 값은 반드시 답 안에 글자 그대로 있는 연속된 조각이어야 한다. 고치거나 요약하거나 보태지 않는다. 한 조각이 사건이면서 사물을 품을 수 있다(사건 "우산 쓰고 엄마를 기다렸어요", 사물 "우산").

답: """${ans}"""

예시
답: "우산 쓰고 엄마를 기다렸어요" → {"event":["우산 쓰고 엄마를 기다렸어요"],"object":["우산"],"sense":[]}
답: "빗소리가 우산에 후두둑 떨어졌어요" → {"event":[],"object":[],"sense":["빗소리가 우산에 후두둑 떨어졌어요"]}
답: "모르겠어요" → {"event":[],"object":[],"sense":[]}

설명 없이 JSON 하나만 출력: {"event": [문자열...], "object": [문자열...], "sense": [문자열...]${S.mode==='ext'?', "speech": [문자열...], "after": [문자열...]':''}}  값이 없으면 빈 배열.`;
  const r=await withRetry(label,()=>callJSON(p,'extract'));
  const out={};
  for(const k of ORDER){out[k]=(Array.isArray(r?.[k])?r[k]:[]).map(v=>keep(v,ans,k)).filter(Boolean)}
  if(r===null)out.failed=true;
  ev(`${label} ← "${ans}"\n→ ${JSON.stringify(r)}\n채택 ${JSON.stringify(out)}`);
  return out;
}

function analyse(body){
  const src=[...allQA().filter(x=>!x.btn).map(x=>x.a),S.extra,S.weather].join(' ');

    words++;
    const digits=core.match(/\d+/g)||[];
    const nw=core.match(NUMW);
    if(digits.some(d=>!src.includes(d))||(nw&&!flat.includes(nw[0].replace(/\s/g,'')))){flags.push(core);return `<span class="w-flag" title="답에 없는 숫자">${esc(tok)}</span>`}
    if(GLUE.has(core)||core.length===1){neu++;return esc(tok)}
    const stem=core.slice(0,2);
    if(flat.includes(stem)){mine++;return `<span class="w-mine">${esc(tok)}</span>`}
    news.push(core);return `<span class="w-new" title="답에서 찾지 못한 말">${esc(tok)}</span>`;
  }).join('')+'</p>').join('');
  return {html,words,mine,neu,news,flags,chars:body.replace(/\s/g,'').length};
}

function runRecord(d=S.draft){
  const a=analyse(d.body);
  const mins=S.t0&&S.tDraftClick?((S.tDraftClick-S.t0-0)/60000):null;
  const sum=k=>USAGE.reduce((n,x)=>n+(x[k]||0),0);
  return {at:d.at,weather:S.weather,scene:S.scene,model:d.model,extractModel:CFG.extract,tin:d.tin,tout:d.tout,
    extractIn:USAGE.filter(x=>x.role!=='draft').reduce((n,x)=>n+x.in,0),extractOut:USAGE.filter(x=>x.role!=='draft').reduce((n,x)=>n+x.out,0),extractCalls:USAGE.filter(x=>x.role!=='draft').length,
    q2:S.s2.answers.length,q3:S.s3.answers.length,mins,mode:S.mode||'base',chars:a.chars,
    slots:Object.fromEntries(ORDER.map(k=>[k,S.s3[k].vals])),
    qa:allQA(),title:d.title,body:d.body,checks:d.checks,fact:d.fact,effort:d.effort,temp:d.temp,

    ev(`사실 점검: ${d.fact.err||d.fact.issues.length+'개'}`);render()});
  on('b-cmp',()=>{const v=$('#cmpModel').value.trim();if(v){S.draftErr=null;makeDraft(true,v)}});
  on('b-copy',e=>copyText(S.drafts.map(d=>recordText(runRecord(d))).join('\n---\n\n'),e.currentTarget));
  document.querySelectorAll('[data-dcopy]').forEach(b=>b.onclick=()=>copyText(recordText(runRecord(S.drafts[+b.dataset.dcopy])),b));
  on('b-pass',()=>{CFG.pass=$('#pass').value;saveCfg();loadModels()});
  on('b-close-settings',()=>{showSettings=false;render()});
  const me=$('#mExtract'),md=$('#mDraft');
  if(me)me.onchange=()=>{CFG.extract=me.value.trim();saveCfg();renderLog()};
  document.querySelectorAll('input[name=qmode]').forEach(x=>x.onchange=()=>{CFG.mode=x.value;saveCfg();renderModelbar()});
  if(md)md.onchange=()=>{CFG.draft=md.value.trim();saveCfg();renderLog()};
  const mef=$('#mEffort'),mtp=$('#mTemp');if(mef)mef.onchange=()=>{CFG.effort=mef.value;saveCfg()};if(mtp)mtp.onchange=()=>{CFG.temp=+mtp.value;saveCfg()};
  document.querySelectorAll('[data-hcopy]').forEach(b=>b.onclick=()=>copyText(recordText(loadRuns()[+b.dataset.hcopy]),b));
  on('b-hall',e=>copyText(loadRuns().map(recordText).join('\n---\n\n'),e.currentTarget));
  on('b-hclear',()=>{try{localStorage.removeItem('naenal-runs')}catch(e){}render()});
}
function startWx(w,custom){S.mode=CFG.mode==='ext'?'ext':'base';ORDER=S.mode==='ext'?ORDER_EXT:ORDER_BASE;ev(`질문 모드: ${MODE_NAME[S.mode]}`);S.weather=w;S.wxCustom=custom;S.t0=Date.now();ev(`날씨: ${w}${custom?' (직접 쓰기 → 질문에는 "그런 날씨")':''}`);s2Next()}
function renderModelbar(){
  const el=$('#modelbar');if(!el)return;
  const on=!!CFG.models.length&&!fatal;
  const b=(label,m)=>`<button class="mb ${on&&m?'':'off'}" data-open-settings title="${esc(m||'미정')}"><i class="dot"></i><span>${label}</span><code>${esc(m||'연결 전')}</code></button>`;
  el.innerHTML=`<button class="mb" data-open-settings><i class="dot" style="background:var(--sky)"></i><span>질문</span><code>${MODE_NAME[S&&S.mode&&S.phase!=='weather'?S.mode:CFG.mode]||'기본'}</code></button>`+b('판독',CFG.extract)+b('초안',CFG.draft)+`<button class="setbtn ${showSettings?'on':''}" id="b-settings" aria-expanded="${showSettings}"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>설정</button>`;
  const open=()=>{showSettings=!showSettings;render();if(showSettings){const d=$('#settingsPanel');if(d)d.scrollIntoView({block:'start',behavior:'smooth'})}};
  el.querySelectorAll('[data-open-settings]').forEach(x=>x.onclick=()=>{showSettings=false;open()});
  $('#b-settings').onclick=open;
}
function renderLog(){
  renderModelbar();
  const st=s=>`<span class="st st-${s}">${s}</span>`;
  let h=`<h4>로직 상태</h4><table class="slots"><tbody>
  <tr><td colspan="4" style="color:var(--ink-2)">2단계 · 장면 ${S.sceneNo}/2</td></tr>
  ${['TIME','PLACE'].map(k=>`<tr><td>${k}</td><td>${st(S.s2[k].st)}</td><td>${S.s2[k].asked}/2</td><td>${esc(S.s2[k].val)}</td></tr>`).join('')}
  <tr><td colspan="4" style="color:var(--ink-2);padding-top:10px">3단계</td></tr>
  ${ORDER.map(k=>`<tr><td>${k}</td><td>${st(S.s3[k].st)}</td><td>${S.s3[k].asked}/2</td><td>${esc(S.s3[k].vals.join(' · '))}</td></tr>`).join('')}
  </tbody></table>
  <h4>토큰 (이번 글)</h4><div class="rule">판독 ${USAGE.filter(x=>x.role!=='draft').length}회 · 입력 ${USAGE.filter(x=>x.role!=='draft').reduce((n,x)=>n+x.in,0)} / 출력 ${USAGE.filter(x=>x.role!=='draft').reduce((n,x)=>n+x.out,0)}
초안 ${USAGE.filter(x=>x.role==='draft').length}회 · 입력 ${USAGE.filter(x=>x.role==='draft').reduce((n,x)=>n+x.in,0)} / 출력 ${USAGE.filter(x=>x.role==='draft').reduce((n,x)=>n+x.out,0)}</div>
  <h4>방금 적용된 규칙</h4><div class="rule">${esc(S.rule)}</div>
  <h4>판독 기록</h4><div class="events">${S.events.map(e=>`<div class="${e.cls}">${e.at}  ${esc(e.t)}</div>`).join('')||'<div>아직 없음</div>'}</div>`;
  $('#log').innerHTML=h;
}
render();
loadModels();
</script>
</body>
</html>
