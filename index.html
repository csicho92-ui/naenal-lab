<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 안의 날씨 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽은 책 한 쪽처럼 질문이 놓이는 지면, 오른쪽은 로직 상태를 보여주는 관측 기록지 */
:root{
  --paper:#EDF0F1; --page:#F8FAFA; --ink:#1E2833; --ink-2:#55626E; --line:#D3DADE;
  --sky:#2F6684; --sky-soft:#DCE8EF; --mine:#1E2833; --new-bg:#F7E3C9; --new-fg:#8A4A12; --flag-bg:#F4CFC6; --flag-fg:#9A2C17;
  --ok:#2E7A55; --warn:#A06A12;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161B; --page:#182027; --ink:#DCE3E8; --ink-2:#97A5B1; --line:#2B3640;
  --sky:#86B7D4; --sky-soft:#1F3443; --mine:#F1F5F8; --new-bg:#4A3418; --new-fg:#F2C894; --flag-bg:#5A241A; --flag-fg:#F7B6A5;
  --ok:#73C69A; --warn:#E3B260; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161B; --page:#182027; --ink:#DCE3E8; --ink-2:#97A5B1; --line:#2B3640;
  --sky:#86B7D4; --sky-soft:#1F3443; --mine:#F1F5F8; --new-bg:#4A3418; --new-fg:#F2C894; --flag-bg:#5A241A; --flag-fg:#F7B6A5;
  --ok:#73C69A; --warn:#E3B260; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}}
header.top{max-width:1080px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em}
header.top p{margin:0;color:var(--ink-2);font-size:13px}
.modelbar{display:flex;gap:8px;flex-wrap:wrap}
.mb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--page);max-width:100%;cursor:pointer}
.mb span{color:var(--ink-2)} .mb code{font-family:var(--f-mono);font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.setbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 14px;border-radius:99px;border:1px solid var(--sky);background:var(--page);color:var(--sky)}
.setbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.setbtn.on,.setbtn:hover{background:var(--sky);color:var(--page)}
.settings{margin-bottom:22px;padding:16px 18px;border:1px solid var(--sky);border-radius:6px;background:var(--sky-soft)}
.settings-head{display:flex;justify-content:space-between;align-items:center}
.settings-head h2{font-size:17px;margin:0}
.settings input{background:var(--page)}
.mb .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)} .mb.off .dot{background:var(--warn)}
.page{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:28px clamp(18px,4vw,40px);min-height:520px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.bigq{font-family:var(--f-display);font-size:clamp(22px,3.4vw,28px);line-height:1.45;margin:10px 0 22px;text-wrap:balance}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
button{font:inherit;font-size:14px;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:var(--page);color:var(--ink)}
button.primary{background:var(--sky);border-color:var(--sky);color:var(--page);font-weight:600}
button.quiet{border-color:transparent;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
button:disabled{opacity:.45;cursor:default}
.weathers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.weathers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wx{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:var(--paper)}
.wx svg{width:40px;height:40px;stroke:var(--sky);fill:none;stroke-width:1.6;stroke-linecap:round}
.wx:hover{border-color:var(--sky)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;min-height:28px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--sky-soft);color:var(--ink)}
.chip b{font-weight:600;color:var(--sky);margin-right:4px}
.scene{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 16px;border-left:3px solid var(--sky);background:var(--paper);margin-bottom:20px;font-size:14px}
.scene dt{color:var(--ink-2)} .scene dd{margin:0;font-weight:500}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.b{max-width:85%;padding:9px 14px;border-radius:14px;font-size:15px}
.b.ai{background:var(--sky-soft);align-self:flex-start;border-bottom-left-radius:4px}
.b.me{background:var(--paper);border:1px solid var(--line);align-self:flex-end;border-bottom-right-radius:4px}
.b.btn{font-style:italic;color:var(--ink-2)}
.note{color:var(--ink-2);font-size:13px}
.busy{color:var(--sky);font-size:14px;margin-top:10px}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.card{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:14px}
.card small{color:var(--sky);font-weight:600;font-size:11px}
.card.off{opacity:.4;text-decoration:line-through}
.card button{padding:2px 8px;border:none;background:none;color:var(--ink-2)}
h2{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
h3{font-size:13px;letter-spacing:.06em;color:var(--ink-2);margin:22px 0 8px;font-weight:600}
.draft{font-family:var(--f-display);font-size:18px;line-height:1.95;max-width:34em}
.draft h2{font-size:24px;margin-bottom:14px}
.draft p{margin:0 0 1em}
.w-mine{font-weight:700;color:var(--mine)}
.w-new{background:var(--new-bg);color:var(--new-fg);border-radius:2px;padding:0 1px}
.w-flag{background:var(--flag-bg);color:var(--flag-fg);border-radius:2px;padding:0 2px;text-decoration:underline wavy}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:18px 0}
.stat{border-top:2px solid var(--line);padding-top:6px}
.stat span{display:block;font-size:12px;color:var(--ink-2)}
.stat strong{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat.bad{border-color:var(--flag-fg)} .stat.good{border-color:var(--ok)}
ol.qa{padding-left:20px;margin:0;font-size:14px} ol.qa li{margin-bottom:6px} ol.qa .q{color:var(--ink-2);display:block;font-size:12.5px}
/* 관측 기록지 */
aside.log{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:16px;font-size:13px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));min-width:0}
@media (max-width:860px){aside.log{position:static}}
aside.log h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.slots{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px;margin-bottom:12px}
.slots td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-all}
.st{font-size:11px;padding:1px 6px;border-radius:3px;white-space:nowrap}
.st-FILLED{background:var(--sky-soft);color:var(--sky)} .st-EMPTY{color:var(--ink-2);border:1px dashed var(--line)} .st-UNKNOWN{background:var(--new-bg);color:var(--new-fg)}
.rule{font-family:var(--f-mono);font-size:12px;background:var(--paper);padding:8px;border-radius:4px;margin-bottom:12px;white-space:pre-wrap}
.events{max-height:300px;overflow:auto;font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:6px}
.events div{border-left:2px solid var(--line);padding-left:8px;white-space:pre-wrap;word-break:break-all}
.events .drop{border-color:var(--flag-fg)} .events .fail{border-color:var(--warn)}
.banner{padding:10px 14px;border-radius:4px;background:var(--new-bg);color:var(--new-fg);font-size:14px;margin-bottom:16px}
details.hist{margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
details.hist summary{cursor:pointer;font-size:13px;color:var(--ink-2)}
.histitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
@media (prefers-reduced-motion:no-preference){.page>*{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

[hidden]{display:none!important}
.steps{display:flex;flex-wrap:wrap;gap:4px 10px;list-style:none;padding:0;margin:0 0 18px;font-size:12px;color:var(--ink-2)}
.steps li{padding:2px 0;border-bottom:2px solid transparent}
.steps li.done{color:var(--ink-2);opacity:.6}
.steps li.now{color:var(--sky);font-weight:600;border-color:var(--sky)}
.onboard .chat{max-width:420px;margin:14px 0 22px}
.b.typing{color:var(--ink-2);letter-spacing:.2em}
.card.pick{cursor:pointer;font:inherit;font-size:14px;color:var(--ink);padding:6px 12px}
.card.pick:hover{border-color:var(--sky)}
.draft u{text-decoration:underline;text-decoration-color:var(--sky);text-decoration-thickness:2px;text-underline-offset:4px}
.sent.flagged{text-decoration:underline wavy var(--flag-fg);text-underline-offset:5px}
textarea.edit{font-family:var(--f-display);font-size:17px;margin:6px 0;background:var(--page);border-color:var(--sky)}
.gam{position:relative;border:1px solid var(--line);border-radius:6px;padding:16px 18px 14px;margin:16px 0;background:var(--paper);max-width:34em}
.gamtag{position:absolute;top:10px;right:12px;font-size:11px;font-weight:600;color:var(--sky);border:1px solid var(--sky);border-radius:99px;padding:0 8px}
.gamq{margin:0 0 6px;color:var(--ink-2);font-size:13.5px}
.gamt{font-family:var(--f-display);font-size:17px;letter-spacing:0;color:var(--ink);margin:0 0 8px}
.pair{font-family:var(--f-display);font-size:15px;margin:0 0 10px}
.pair s{color:var(--ink-2)}
.gam details summary{cursor:pointer;font-size:13px;color:var(--sky)}
.gam blockquote{margin:8px 0 4px;padding-left:12px;border-left:2px solid var(--line);font-family:var(--f-display);font-size:14.5px;line-height:1.8}
.gam cite{display:block;font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--ink-2);margin-top:4px}
.gamdone{margin:8px 0}
.wxline{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px}
.wxline svg,.wxicons svg,.book svg{stroke:var(--sky);fill:none;stroke-width:1.8;stroke-linecap:round;vertical-align:middle}
.shelf-h{font-size:24px;margin-bottom:14px}
.wxmap{display:grid;gap:6px;margin-bottom:22px}
.wxrow{display:grid;grid-template-columns:3.2em 1fr;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.wxicons{display:flex;flex-wrap:wrap;gap:6px}
.ago{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px}
.book{border-bottom:1px solid var(--line);padding:10px 0}
.book summary{cursor:pointer}
.book .draft{font-size:16px;margin:10px 0 0}
.top a{color:var(--sky)}
</style>
</head>
<body>
<header class="top">
  <h1>내 안의 날씨 실험실 <span class="note" style="font-family:var(--f-body);font-weight:400">v2 · 유저 플로우 + 초안 지침(10/30)</span></h1>
  <div class="modelbar" id="modelbar" aria-live="polite"></div>
</header>
<div class="wrap">
  <main class="page" id="main"></main>
  <aside class="log" id="log"></aside>
</div>
<script src="draft-guide.js"></script>
<script src="v2.js"></script>
</body>
</html>
